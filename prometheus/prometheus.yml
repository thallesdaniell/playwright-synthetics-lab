global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: pushgateway
    # Obrigatório para Pushgateway: mantém os labels enviados pelo reporter
    # (job="synthetics", journey="login-api") em vez de sobrescrever com
    # job="pushgateway" e instance="pushgateway:9091".
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
